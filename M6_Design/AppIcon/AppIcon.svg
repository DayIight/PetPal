<?xml version="1.0" encoding="UTF-8"?>
<!--
  PetPal App Icon — 1024×1024 主图（iOS 全尺寸方图，圆角由系统施加）
  图层结构（自下而上）：
    1. background   暖橙对角渐变底 + 柔光
    2. cat          浅蓝猫咪（后层，右侧）
    3. dog          奶油白狗狗（前层，左侧，脸颊相贴）
    4. features     双宠五官（深橙棕，同色系功能色）
    5. heart        头顶爱心（社交/社区符号）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="1" stop-color="#FF6F3C"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景层 -->
  <g id="background">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGradient)"/>
    <circle cx="512" cy="560" r="430" fill="#FFFFFF" opacity="0.07"/>
  </g>

  <!-- 2. 猫咪层（后） -->
  <g id="cat">
    <!-- 耳朵（圆角三角） -->
    <path d="M515 385 L545 215 L640 330 Z" fill="#7EC8E3" stroke="#7EC8E3" stroke-width="28" stroke-linejoin="round"/>
    <path d="M805 385 L775 215 L680 330 Z" fill="#7EC8E3" stroke="#7EC8E3" stroke-width="28" stroke-linejoin="round"/>
    <!-- 内耳（浅蓝同色系浅色） -->
    <path d="M545 360 L565 255 L615 330 Z" fill="#A9DEF2"/>
    <path d="M775 360 L755 255 L705 330 Z" fill="#A9DEF2"/>
    <!-- 头 -->
    <circle cx="660" cy="540" r="220" fill="#7EC8E3"/>
  </g>

  <!-- 3. 狗狗层（前，与猫脸颊相贴） -->
  <g id="dog">
    <!-- 垂耳（奶油白同色系深色，后画耳先画头前） -->
    <ellipse cx="545" cy="430" rx="62" ry="115" transform="rotate(38 545 430)" fill="#F0DFC2"/>
    <ellipse cx="150" cy="580" rx="76" ry="138" transform="rotate(14 150 580)" fill="#F0DFC2"/>
    <!-- 头 -->
    <circle cx="380" cy="575" r="230" fill="#FFF4E6"/>
    <!-- 吻部 -->
    <ellipse cx="380" cy="665" rx="100" ry="72" fill="#FFFDF9"/>
  </g>

  <!-- 4. 五官层（深橙棕 #5C3A2E，主色同色系功能色） -->
  <g id="features" stroke="#5C3A2E" stroke-linecap="round">
    <!-- 狗：圆点眼 + 鼻 + 自然微笑 -->
    <g fill="#5C3A2E" stroke="none">
      <circle cx="310" cy="545" r="22"/>
      <circle cx="450" cy="545" r="22"/>
      <ellipse cx="380" cy="640" rx="36" ry="27"/>
    </g>
    <path d="M380 667 Q380 692 348 697 M380 667 Q380 692 412 697" fill="none" stroke-width="13"/>
    <!-- 猫：闭眼笑弧 + 鼻 + 嘴 + 外侧胡须 -->
    <path d="M625 520 Q650 495 675 520 M705 520 Q730 495 755 520" fill="none" stroke-width="14"/>
    <g fill="#5C3A2E" stroke="none">
      <ellipse cx="690" cy="565" rx="18" ry="12"/>
    </g>
    <path d="M690 580 Q690 600 665 603 M690 580 Q690 600 715 603" fill="none" stroke-width="10"/>
    <path d="M770 572 L838 560 M772 600 L836 606" fill="none" stroke-width="8" opacity="0.55"/>
    <!-- 腮红（暖橙同色系，低透明） -->
    <g fill="#FF9E5E" stroke="none" opacity="0.35">
      <circle cx="280" cy="640" r="30"/>
      <circle cx="480" cy="640" r="30"/>
      <circle cx="775" cy="615" r="26"/>
    </g>
  </g>

  <!-- 5. 爱心符号层（社交/社区） -->
  <g id="heart">
    <path d="M512 255 C472 218 424 194 424 152 C424 118 451 99 480 99 C496 99 508 109 512 121 C516 109 528 99 544 99 C573 99 600 118 600 152 C600 194 552 218 512 255 Z" fill="#FFF4E6"/>
  </g>
</svg>
