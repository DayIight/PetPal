name: PetPal

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  PetPal:
    type: application
    platform: iOS
    sources:
      - path: M1_PetProfile/PetProfileSkeleton.swift
      - path: M1_PetProfile/PetFormView.swift
      - path: M1_PetProfile/PetManagementView.swift
      - path: M1_PetProfile/AvatarPickerView.swift
      - path: M1_PetProfile/DatabaseBackupManager.swift
      - path: M1_PetProfile/PortableBackup.swift
      - path: M1_PetProfile/BackupManagementView.swift
      - path: M1_PetProfile/PrivacySupportView.swift
      - path: M2_DailyRecords/DailyRecordSkeleton.swift
      - path: M2_DailyRecords/RecordCalendarView.swift
      - path: M2_DailyRecords/CustomTemplateViews.swift
      - path: M2_DailyRecords/RecordsHomeView.swift
      - path: M2_DailyRecords/RecordTemplatePickerView.swift
      - path: M2_DailyRecords/PresetRecordFormView.swift
      - path: M2_DailyRecords/MoodPicker.swift
      - path: M2_DailyRecords/RecordPhotoPicker.swift
      - path: M4_Reminders/ReminderSkeleton.swift
      - path: M4_Reminders/ReminderRecurrence.swift
      - path: M4_Reminders/ReminderFormView.swift
      - path: M4_Reminders/ReminderListView.swift
      - path: M5_Dashboard/DashboardSkeleton.swift
      - path: M5_Dashboard/DashboardView.swift
      - path: M5_Dashboard/DashboardCharts.swift
      - path: M5_Dashboard/DashboardHealthTimeline.swift
      - path: M5_Dashboard/DashboardPDF.swift
      - path: M6_Design/DesignSkeleton.swift
      - path: M7_Prototype/PrototypeApp.swift
      - path: M7_Prototype/WeightFormView.swift
      - path: M8_Widget/WidgetSnapshot.swift
      - path: M8_Widget/WidgetPetPaging.swift
      - path: M8_Widget/SelectWidgetPetIntent.swift
      - path: M8_Widget/WidgetSnapshotSyncer.swift
      - path: M6_Design/AppIcon/PetPal-Social/PetPalSocial.icon
        type: file
        buildPhase: resources
      - path: PetPal/Assets.xcassets
      - path: PetPal/Models/PetPal.xcdatamodeld
      - path: PetPal/Models/CoreDataEntities.swift
      - path: PetPal/Supporting/PrivacyInfo.xcprivacy
    dependencies:
      - target: PetPalWidget
    info:
      path: PetPal/Supporting/Info.plist
      properties:
        CFBundleDisplayName: PetPal
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.petpal.backup
            UTTypeDescription: PetPal 完整备份
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - petpalbackup
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.petpal.pet
            CFBundleURLSchemes:
              - petpal
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 拍摄宠物头像与记录照片
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petpal.prototype
        PRODUCT_NAME: PetPal
        ASSETCATALOG_COMPILER_APPICON_NAME: PetPalSocial
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PetPal/Supporting/PetPal.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

  PetPalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: M1_PetProfile/PetProfileTests.swift
      - path: M1_PetProfile/LaunchReadinessTests.swift
      - path: M1_PetProfile/LaunchFollowupTests.swift
      - path: M2_DailyRecords/DailyRecordTests.swift
      - path: M4_Reminders/ReminderTests.swift
      - path: M5_Dashboard/DashboardTests.swift
      - path: M8_Widget/WidgetSnapshotTests.swift
    dependencies:
      - target: PetPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petpal.prototype.tests
        GENERATE_INFOPLIST_FILE: YES

  PetPalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: M7_Prototype/PrototypeUITests.swift
      - path: M7_Prototype/WeightUITests.swift
    dependencies:
      - target: PetPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petpal.prototype.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PetPal

  PetPalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PetPalWidget/PetPalWidget.swift
      - path: M8_Widget/WidgetSnapshot.swift
      - path: M8_Widget/WidgetPetPaging.swift
      - path: M8_Widget/SelectWidgetPetIntent.swift
      - path: M4_Reminders/ReminderRecurrence.swift
    info:
      path: PetPalWidget/Info.plist
      properties:
        CFBundleDisplayName: PetPal
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petpal.prototype.widget
        PRODUCT_NAME: PetPalWidget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PetPalWidget/PetPalWidget.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

schemes:
  PetPal:
    build:
      targets:
        PetPal: all
        PetPalWidget: all
        PetPalTests:
          - test
        PetPalUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: PetPalTests
        - name: PetPalUITests
